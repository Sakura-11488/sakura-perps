[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
# overflow-checks stays ON in release. This is a financial program; a silent
# wraparound in margin math is worth far more than the compute units it costs.
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
