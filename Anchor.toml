[toolchain]
# Anchor honours these and fetches matching binaries, so `anchor build` is
# self-pinning for anyone who clones. The CLI version MUST equal the anchor-lang
# version in Cargo.toml — if they drift, account discriminators and the generated
# IDL diverge from what the deployed program actually expects.
anchor_version = "0.32.1"
solana_version = "3.0.14"

[features]
resolution = true
skip-lint = false

[programs.localnet]
sakura_perps = "5Va7HpaA9oRu9cqGXwvqwW3koqE1fBwsGcooFpL6jr2y"

[programs.devnet]
sakura_perps = "5Va7HpaA9oRu9cqGXwvqwW3koqE1fBwsGcooFpL6jr2y"

# There is deliberately no [programs.mainnet] block, and there will not be one
# until this code has been audited. Its absence means a mistyped
# `anchor deploy --provider.cluster mainnet` fails loudly instead of succeeding.

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
# Forward slashes. The predecessor used Windows backslashes inside quotes, which
# cannot resolve on Linux or in CI.
wallet = "~/.config/solana/sakura-perps-devnet-deployer.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
