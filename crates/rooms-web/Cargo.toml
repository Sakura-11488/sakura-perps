[package]
name = "sakura-perps-rooms-web"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "Bounded browser facade for a fixed signed Risk Rooms paper scenario"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sakura-perps-rooms = { path = "../rooms" }
sakura-perps-rooms-auth = { path = "../rooms-auth" }
sakura-perps-risk = { path = "../risk" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
wasm-bindgen = "=0.2.126"

[dev-dependencies]
ed25519-dalek = "=2.2.0"
