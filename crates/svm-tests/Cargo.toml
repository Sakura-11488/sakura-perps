[package]
name = "sakura-perps-svm-tests"
version = "0.1.0"
description = "In-process SVM integration tests for Sakura Perps."
edition = "2021"
license = "BUSL-1.1"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
# LiteSVM rather than solana-program-test: roughly an order of magnitude faster,
# synchronous, and — the reason it is chosen here — `set_account` lets a test
# write arbitrary bytes into any account. That is what makes a stale or
# wide-confidence Pyth feed testable in milliseconds instead of unreachable.
# Granular solana crates matching what litesvm 0.15 is built against, NOT
# solana-sdk. solana-sdk 2.x brings solana-clock 2.2 while litesvm wants 3.1, and
# they are genuinely different types -- the first attempt failed with
# "the trait bound solana_sdk::solana_clock::Clock: GetSysvar is not satisfied".
litesvm = "0.15"
# Mint and token-account builders. Pinned to the same 0.15 line as litesvm, and
# it depends on the same solana-address ~2.6.1, so no second type family.
litesvm-token = "0.15"
solana-address = "2.6"
solana-account = "4.3"
solana-clock = "3.1"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-transaction = "4.1"
solana-instruction = "3.4"
solana-transaction-error = "3.3"
anchor-lang = "1.1.2"
pyth-solana-receiver-sdk = "2.0.0"
sakura-perps = { path = "../../programs/sakura-perps", features = ["no-entrypoint"] }
sakura-perps-risk = { path = "../risk" }
